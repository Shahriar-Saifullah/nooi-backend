# Builds the photo render worker (render-worker/) and publishes it to GitHub
# Container Registry, where the RunPod serverless endpoint pulls it from.
name: render-worker

on:
  # any branch: the image is only used once RunPod points at it
  push:
    paths: ["render-worker/**", ".github/workflows/render-worker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        # registry names must be lower case
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nooi-render-worker" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: render-worker
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
